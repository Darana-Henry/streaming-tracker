<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Tracker</title>

  <!-- Firebase SDK (compat mode — no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* ── Reset / base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #232636;
      --border:      #2e3148;
      --text:        #e2e4f0;
      --muted:       #737a9e;
      --accent:      #6c7ef8;
      --accent-dim:  #3d4891;
      --seen-bg:     #111820;
      --seen-border: #1e3345;

      /* provider colours */
      --hst: #1c6fb5;
      --prv: #00a8e0;
      --lgy: #d4860a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; flex: 1; }
    header h1 span { color: var(--accent); }

    #auth-area { display: flex; align-items: center; gap: 12px; }
    #user-name { font-size: 13px; color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #auth-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s;
    }
    #auth-btn:hover { background: #7f92ff; }
    #auth-btn.signed-in { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-weight: 400; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    #layout { display: flex; align-items: flex-start; }

    /* ── Filter sidebar ──────────────────────────────────────────────────── */
    #filters {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 14px;
      min-height: calc(100vh - 57px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .filter-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Checkboxes */
    .cb-list { display: flex; flex-direction: column; gap: 6px; }
    .cb-list label, .toggle-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }
    .cb-list input[type="checkbox"], .toggle-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer;
    }

    /* Provider badges in filter */
    .badge-hst { color: var(--hst); }
    .badge-prv { color: var(--prv); }
    .badge-lgy { color: var(--lgy); }

    /* Content type buttons */
    .type-btns { display: flex; gap: 4px; }
    .type-btn {
      flex: 1;
      padding: 5px 2px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .type-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #fff;
    }

    /* Dual year slider */
    .range-wrap {
      position: relative;
      height: 22px;
      margin-top: 4px;
    }
    .range-wrap input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 4px;
      top: 50%;
      transform: translateY(-50%);
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      outline: none;
      pointer-events: none;
    }
    .range-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      pointer-events: all;
    }
    .range-wrap input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      pointer-events: all;
      border: none;
    }
    #range-track {
      position: absolute;
      height: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent-dim);
      border-radius: 2px;
      pointer-events: none;
    }
    .range-bg {
      position: absolute;
      inset: 0;
      height: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--border);
      border-radius: 2px;
      pointer-events: none;
    }
    #year-label { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }

    /* Genre list (scrollable) */
    .genre-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .genre-list label { font-size: 12px; }

    /* Language select */
    select {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    select option { background: var(--surface2); }

    /* Hide-seen toggle */
    .toggle-row { margin-top: 4px; }

    /* ── Main area ───────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      padding: 16px 20px;
      min-width: 0;
    }

    #stats {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Card grid ───────────────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .15s, transform .1s;
    }
    .card:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
    .card.is-seen {
      background: var(--seen-bg);
      border-color: var(--seen-border);
      opacity: .65;
    }
    .card.is-seen:hover { opacity: .85; }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      /* clamp long titles */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-year { font-size: 12px; color: var(--muted); }

    .provider-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: .3px;
    }
    .badge-hst-card { background: #0d3f6e; color: #60b0ff; }
    .badge-prv-card { background: #003a52; color: #41c6f5; }
    .badge-lgy-card { background: #4a2e00; color: #f0a830; }
    .badge-other    { background: var(--surface2); color: var(--muted); }

    .card-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .meta-chip {
      background: var(--surface2);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .card-imdb {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .imdb-star { color: #f5c518; font-size: 13px; }
    .imdb-score { font-weight: 700; }
    .imdb-votes { color: var(--muted); font-size: 11px; }

    .card-info  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card-credit { font-size: 11px; color: var(--muted); }
    .card-credit span { color: var(--text); }

    /* ── Search ──────────────────────────────────────────────────────────── */
    #search-input {
      flex: 1;
      max-width: 300px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }

    .card-footer { margin-top: auto; }
    .seen-btn {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .seen-btn:hover { border-color: var(--accent); color: var(--accent); }
    .seen-btn.is-seen {
      background: var(--seen-border);
      border-color: var(--seen-border);
      color: #5a7fa0;
    }
    .seen-btn:disabled { opacity: .4; cursor: default; }

    /* ── Loading / empty states ──────────────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #layout { flex-direction: column; }
      #filters { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid var(--border); }
      #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

<header>
  <h1>Streaming <span>Tracker</span></h1>
  <input type="search" id="search-input" placeholder="Search titles, cast, director…">
  <div id="auth-area">
    <span id="user-name"></span>
    <button id="auth-btn">Sign in with Google</button>
  </div>
</header>

<div id="layout">

  <!-- ── Filters ─────────────────────────────────────────────────────────── -->
  <aside id="filters">

    <div class="filter-section">
      <h3>Provider</h3>
      <div class="cb-list">
        <label><input type="checkbox" class="provider-cb" value="hst" checked>
          <span class="badge-hst">Hotstar</span></label>
        <label><input type="checkbox" class="provider-cb" value="prv" checked>
          <span class="badge-prv">Prime Video</span></label>
        <label><input type="checkbox" class="provider-cb" value="lgy" checked>
          <span class="badge-lgy">Lionsgate Play</span></label>
      </div>
    </div>

    <div class="filter-section">
      <h3>Type</h3>
      <div class="type-btns">
        <button class="type-btn active" data-value="both">Both</button>
        <button class="type-btn" data-value="movie">Movies</button>
        <button class="type-btn" data-value="show">Shows</button>
      </div>
    </div>

    <div class="filter-section">
      <h3>Year</h3>
      <div class="range-wrap" id="range-wrap">
        <div class="range-bg"></div>
        <div id="range-track"></div>
        <input type="range" id="year-from" min="1900" max="2025" value="1900">
        <input type="range" id="year-to"   min="1900" max="2025" value="2025">
      </div>
      <span id="year-label">1900 – 2025</span>
    </div>

    <div class="filter-section">
      <h3>Genre</h3>
      <div class="genre-list" id="genre-list">
        <span style="color:var(--muted);font-size:12px">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3>Sort by</h3>
      <select id="sort-select">
        <option value="popular">Popular</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>

    <div class="filter-section">
      <div class="toggle-row">
        <label>
          <input type="checkbox" id="hide-seen">
          Hide seen titles
        </label>
      </div>
    </div>

  </aside>

  <!-- ── Main content ──────────────────────────────────────────────────── -->
  <div id="main">
    <div id="stats"></div>
    <div id="loading">Loading titles…</div>
    <div id="grid" style="display:none"></div>
  </div>

</div>

<script>
// ── Firebase config ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_AUTH_DOMAIN",
  databaseURL:       "YOUR_DATABASE_URL",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ── State ──────────────────────────────────────────────────────────────────────
let currentUser  = null;
let allTitles    = {};   // id → title object
let seenMap      = {};   // id → true

const filters = {
  providers:   new Set(['hst','prv','lgy']),
  type:        'both',
  yearFrom:    1900,
  yearTo:      2025,
  genres:      new Set(),
  hideSeen:    false,
  searchQuery: '',
  sortBy:      'popular',
};

// ── Auth ───────────────────────────────────────────────────────────────────────
const authBtn  = document.getElementById('auth-btn');
const userName = document.getElementById('user-name');

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    userName.textContent  = user.displayName || user.email;
    authBtn.textContent   = 'Sign out';
    authBtn.className     = 'signed-in';
  } else {
    userName.textContent  = '';
    authBtn.textContent   = 'Sign in with Google';
    authBtn.className     = '';
  }
  // Re-render so seen buttons enable/disable correctly
  renderGrid(getFiltered());
});

authBtn.addEventListener('click', () => {
  if (currentUser) {
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
});

// ── Data loading ───────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [titlesSnap, seenSnap] = await Promise.all([
      db.ref('/titles').get(),
      db.ref('/seen').get(),
    ]);

    allTitles = titlesSnap.val() || {};
    seenMap   = seenSnap.val()   || {};

    buildFiltersUI();
    applyAndRender();
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
    console.error(err);
  }
}

// ── Build dynamic filter UI ────────────────────────────────────────────────────
function buildFiltersUI() {
  const genreSet = new Set();
  let   minYear  = Infinity;
  let   maxYear  = -Infinity;

  Object.values(allTitles).forEach(t => {
    (t.genres || []).forEach(g => genreSet.add(g));
    if (t.year) { minYear = Math.min(minYear, t.year); maxYear = Math.max(maxYear, t.year); }
  });

  // Year slider bounds
  if (isFinite(minYear)) {
    ['year-from','year-to'].forEach(id => {
      const el = document.getElementById(id);
      el.min = minYear; el.max = maxYear;
    });
    document.getElementById('year-from').value = minYear;
    document.getElementById('year-to').value   = maxYear;
    filters.yearFrom = minYear;
    filters.yearTo   = maxYear;
    updateYearLabel();
    updateRangeTrack();
  }

  // Genre checkboxes
  const genreList = document.getElementById('genre-list');
  genreList.innerHTML = '';
  [...genreSet].sort().forEach(g => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" class="genre-cb" value="${escHtml(g)}"> ${escHtml(g)}`;
    genreList.appendChild(lbl);
  });
  genreList.querySelectorAll('.genre-cb').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) filters.genres.add(cb.value);
      else            filters.genres.delete(cb.value);
      applyAndRender();
    })
  );

}

// ── Filter logic ───────────────────────────────────────────────────────────────
function getFiltered() {
  const results = Object.values(allTitles).filter(t => {
    if (filters.providers.size > 0) {
      const provs = t.providers || [];
      if (!provs.some(p => filters.providers.has(p))) return false;
    }
    if (filters.type !== 'both' && t.contentType !== filters.type) return false;
    if (t.year && (t.year < filters.yearFrom || t.year > filters.yearTo)) return false;
    if (filters.genres.size > 0) {
      const tGenres = t.genres || [];
      if (!tGenres.some(g => filters.genres.has(g))) return false;
    }
    if (filters.hideSeen && seenMap[String(t.id)]) return false;
    if (filters.searchQuery) {
      const q       = filters.searchQuery.toLowerCase();
      const inName  = (t.name     || '').toLowerCase().includes(q);
      const inDir   = (t.director || '').toLowerCase().includes(q);
      const inCast  = (t.actors   || []).some(a => a.toLowerCase().includes(q));
      if (!inName && !inDir && !inCast) return false;
    }
    return true;
  });

  switch (filters.sortBy) {
    case 'newest':  results.sort((a, b) => (b.year ?? 0) - (a.year ?? 0));          break;
    case 'oldest':  results.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999));    break;
    case 'rating':  results.sort((a, b) => (b.imdbRating ?? 0) - (a.imdbRating ?? 0)); break;
  }

  return results;
}

function applyAndRender() {
  renderGrid(getFiltered());
}

// ── Card rendering ─────────────────────────────────────────────────────────────
function renderGrid(titles) {
  const grid    = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const stats   = document.getElementById('stats');

  const total    = Object.keys(allTitles).length;
  const seenCount = Object.keys(seenMap).length;
  stats.textContent =
    `Showing ${titles.length} of ${total} titles · ${seenCount} seen`;

  if (total === 0) {
    loading.textContent = 'No titles loaded yet. Run the scraper first.';
    loading.style.display = 'block';
    grid.style.display    = 'none';
    return;
  }
  loading.style.display = 'none';
  grid.style.display    = '';

  grid.innerHTML = '';
  titles.forEach(t => grid.appendChild(makeCard(t)));
}

function makeCard(t) {
  const isSeen = !!seenMap[String(t.id)];
  const div    = document.createElement('div');
  div.className = 'card' + (isSeen ? ' is-seen' : '');
  div.dataset.id = t.id;

  const provBadges = (t.providers || [])
    .map(p => `<span class="badge ${provBadgeClass(p)}">${provLabel(p)}</span>`)
    .join('');

  const imdbBlock = t.imdbRating
    ? `<div class="card-imdb">
         <span class="imdb-star">★</span>
         <span class="imdb-score">${t.imdbRating.toFixed(1)}</span>
         ${t.imdbVotes ? `<span class="imdb-votes">(${fmtVotes(t.imdbVotes)})</span>` : ''}
       </div>`
    : '';

  const infoParts = [
    t.runtime  ? `⏱ ${t.runtime} min` : null,
    t.ageRating ? t.ageRating : null,
  ].filter(Boolean).join(' · ');

  const genreChipsMeta = (t.genres || []).slice(0, 3)
    .map(g => `<span class="meta-chip">${escHtml(g)}</span>`).join('');

  const creditsBlock = [
    t.director              ? `<div class="card-credit">Dir: <span>${escHtml(t.director)}</span></div>` : '',
    t.actors && t.actors.length ? `<div class="card-credit">Cast: <span>${t.actors.map(escHtml).join(', ')}</span></div>` : '',
  ].join('');

  const btnLabel = isSeen ? '✓ Seen — Undo' : 'Mark as seen';
  const btnClass = 'seen-btn' + (isSeen ? ' is-seen' : '');
  const disabled = currentUser ? '' : 'disabled title="Sign in to track"';

  div.innerHTML = `
    <div>
      <div class="card-title">${escHtml(t.name || 'Unknown')}</div>
      <div class="card-year">${t.year || '—'} · ${t.contentType === 'show' ? 'TV Show' : 'Movie'}</div>
      ${infoParts ? `<div class="card-info">${escHtml(infoParts)}</div>` : ''}
    </div>
    <div class="provider-badges">${provBadges}</div>
    ${imdbBlock}
    <div class="card-meta">${genreChipsMeta}</div>
    ${creditsBlock}
    <div class="card-footer">
      <button class="seen-btn ${isSeen ? 'is-seen' : ''}" ${disabled}>${btnLabel}</button>
    </div>
  `;

  div.querySelector('.seen-btn').addEventListener('click', () => toggleSeen(t.id, !isSeen));
  return div;
}

// ── Seen tracking ──────────────────────────────────────────────────────────────
async function toggleSeen(id, markSeen) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (markSeen) {
      await db.ref('/seen/' + key).set(true);
      seenMap[key] = true;
    } else {
      await db.ref('/seen/' + key).remove();
      delete seenMap[key];
    }
    // Re-render only the affected card for speed
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      const fresh = makeCard(allTitles[key] || allTitles[id]);
      card.replaceWith(fresh);
    }
    // Update stats
    const total   = Object.keys(allTitles).length;
    const seenCount = Object.keys(seenMap).length;
    const filtered  = getFiltered();
    document.getElementById('stats').textContent =
      `Showing ${filtered.length} of ${total} titles · ${seenCount} seen`;

    // If hiding-seen and we just marked as seen, remove the card
    if (filters.hideSeen && markSeen) {
      const card2 = document.querySelector(`.card[data-id="${id}"]`);
      if (card2) card2.remove();
    }
  } catch (err) {
    console.error('Seen toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

// ── Dual year range slider ─────────────────────────────────────────────────────
const yearFrom  = document.getElementById('year-from');
const yearTo    = document.getElementById('year-to');
const yearLabel = document.getElementById('year-label');
const rangeTrk  = document.getElementById('range-track');
const rangeWrap = document.getElementById('range-wrap');

function updateYearLabel() {
  yearLabel.textContent = `${yearFrom.value} – ${yearTo.value}`;
}
function updateRangeTrack() {
  const min   = +yearFrom.min, max = +yearFrom.max;
  const left  = ((+yearFrom.value - min) / (max - min)) * 100;
  const right = ((+yearTo.value - min)   / (max - min)) * 100;
  rangeTrk.style.left  = left  + '%';
  rangeTrk.style.width = (right - left) + '%';
}

yearFrom.addEventListener('input', () => {
  if (+yearFrom.value > +yearTo.value) yearTo.value = yearFrom.value;
  filters.yearFrom = +yearFrom.value;
  updateYearLabel(); updateRangeTrack(); applyAndRender();
});
yearTo.addEventListener('input', () => {
  if (+yearTo.value < +yearFrom.value) yearFrom.value = yearTo.value;
  filters.yearTo = +yearTo.value;
  updateYearLabel(); updateRangeTrack(); applyAndRender();
});

// ── Other filter event listeners ───────────────────────────────────────────────
document.querySelectorAll('.provider-cb').forEach(cb => {
  cb.addEventListener('change', () => {
    if (cb.checked) filters.providers.add(cb.value);
    else            filters.providers.delete(cb.value);
    applyAndRender();
  });
});

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filters.type = btn.dataset.value;
    applyAndRender();
  });
});

document.getElementById('sort-select').addEventListener('change', e => {
  filters.sortBy = e.target.value;
  applyAndRender();
});

document.getElementById('hide-seen').addEventListener('change', e => {
  filters.hideSeen = e.target.checked;
  applyAndRender();
});

document.getElementById('search-input').addEventListener('input', e => {
  filters.searchQuery = e.target.value.trim();
  applyAndRender();
});

// ── Helpers ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function provLabel(code) {
  return { hst: 'Hotstar', prv: 'Prime', lgy: 'Lionsgate' }[code] || code.toUpperCase();
}

function provBadgeClass(code) {
  return { hst: 'badge-hst-card', prv: 'badge-prv-card', lgy: 'badge-lgy-card' }[code] || 'badge-other';
}

const LANG_NAMES = {
  en: 'English', hi: 'Hindi', ta: 'Tamil', te: 'Telugu',
  ml: 'Malayalam', kn: 'Kannada', mr: 'Marathi', bn: 'Bengali',
  pa: 'Punjabi', gu: 'Gujarati', ko: 'Korean', ja: 'Japanese',
  fr: 'French', de: 'German', es: 'Spanish', it: 'Italian',
  zh: 'Chinese', pt: 'Portuguese', ru: 'Russian', ar: 'Arabic',
};
function langLabel(code) {
  return LANG_NAMES[code] || code.toUpperCase();
}

function fmtVotes(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'K';
  return String(n);
}

// ── Boot ───────────────────────────────────────────────────────────────────────
loadData();
