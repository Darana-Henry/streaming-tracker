<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Tracker</title>

  <!-- Firebase SDK (compat mode — no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* ── Reset / base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #232636;
      --border:      #2e3148;
      --text:        #e2e4f0;
      --muted:       #737a9e;
      --accent:      #6c7ef8;
      --accent-dim:  #3d4891;
      --seen-bg:     #111820;
      --seen-border: #1e3345;

      /* provider colours */
      --jhs: #7b2ff7;
      --prv: #00a8e0;
      --lgp: #d4860a;
      --snl: #cc0f16;
      --snx: #e8620a;
      --zee: #6b21d6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; flex: 1; }
    header h1 span { color: var(--accent); }

    #auth-area { display: flex; align-items: center; gap: 12px; }
    #user-name { font-size: 13px; color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #auth-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s;
    }
    #auth-btn:hover { background: #7f92ff; }
    #auth-btn.signed-in { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-weight: 400; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    #layout { display: flex; align-items: flex-start; }

    /* ── Filter sidebar ──────────────────────────────────────────────────── */
    #filters {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 14px;
      min-height: calc(100vh - 57px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .filter-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Checkboxes */
    .cb-list { display: flex; flex-direction: column; gap: 6px; }
    .cb-list label, .toggle-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }
    .cb-list input[type="checkbox"], .toggle-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer;
    }

    /* Provider badges in filter */
    .badge-jhs { color: var(--jhs); }
    .badge-prv { color: var(--prv); }
    .badge-lgp { color: var(--lgp); }
    .badge-snl { color: var(--snl); }
    .badge-snx { color: var(--snx); }
    .badge-zee { color: var(--zee); }

    /* Content type buttons */
    .type-btns { display: flex; gap: 4px; }
    .type-btn {
      flex: 1;
      padding: 5px 2px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .type-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #fff;
    }

    /* Year range inputs */
    .year-inputs { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .year-inputs input[type="number"] {
      width: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 4px 6px;
      -moz-appearance: textfield;
    }
    .year-inputs input[type="number"]::-webkit-inner-spin-button,
    .year-inputs input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .year-inputs input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .year-sep { font-size: 12px; color: var(--muted); }

    /* Genre list (scrollable) */
    .genre-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .genre-list label { font-size: 12px; }

    /* Language select */
    select {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    select option { background: var(--surface2); }

    /* Hide-seen toggle */
    .toggle-row { margin-top: 4px; }

    /* ── Main area ───────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      padding: 16px 20px;
      min-width: 0;
    }

    #stats {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Card grid ───────────────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .15s, transform .1s;
    }
    .card:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
    .card.is-seen {
      background: var(--seen-bg);
      border-color: var(--seen-border);
      opacity: .65;
    }
    .card.is-seen:hover { opacity: .85; }

    /* Poster */
    .card-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-poster-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: var(--border);
    }

    /* Card body (text below poster) */
    .card-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      /* clamp long titles */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-year { font-size: 12px; color: var(--muted); }

    .provider-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: .3px;
    }
    .badge-jhs-card { background: #2d1060; color: #b07aff; }
    .badge-prv-card { background: #003a52; color: #41c6f5; }
    .badge-lgp-card { background: #4a2e00; color: #f0a830; }
    .badge-snl-card { background: #4a0305; color: #ff6b70; }
    .badge-snx-card { background: #4a1e00; color: #ff9050; }
    .badge-zee-card { background: #2a0d5e; color: #c084fc; }
    .badge-other    { background: var(--surface2); color: var(--muted); }

    .card-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .meta-chip {
      background: var(--surface2);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .card-imdb {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .imdb-star { color: #f5c518; font-size: 13px; }
    .imdb-score { font-weight: 700; }
    .imdb-votes { color: var(--muted); font-size: 11px; }

    .card-info  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card-credit { font-size: 11px; color: var(--muted); }
    .card-credit span { color: var(--text); }

    /* ── Search ──────────────────────────────────────────────────────────── */
    #search-input {
      flex: 1;
      max-width: 300px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }

    .card-footer { display: flex; flex-direction: column; gap: 5px; }

    .seen-btn {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .seen-btn:hover { border-color: var(--accent); color: var(--accent); }
    .seen-btn.is-seen {
      background: var(--seen-border);
      border-color: var(--seen-border);
      color: #5a7fa0;
    }
    .seen-btn:disabled { opacity: .4; cursor: default; }

    /* ── Loading / empty states ──────────────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Watchlist button ───────────────────────────────────────────────────── */
    .watch-btn {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .watch-btn:hover { border-color: var(--accent); color: var(--accent); }
    .watch-btn.is-watchlisted { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
    .watch-btn.remove-wl:hover { border-color: #ef4444; color: #ef4444; }
    .watch-btn:disabled { opacity: .4; cursor: default; }

    /* ── Tabs ───────────────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 2px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* ── My Lists pane ──────────────────────────────────────────────────────── */
    #mylists-pane { padding: 20px 24px; }
    .mylist-section { margin-bottom: 40px; }
    .mylist-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .mylist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .empty-state { color: var(--muted); font-size: 14px; padding: 12px 0; }

    /* ── Tracking add area ──────────────────────────────────────────────────── */
    .tracking-add { display: flex; gap: 8px; margin-bottom: 12px; max-width: 580px; }
    .tracking-add input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .tracking-add input:focus { border-color: var(--accent); }
    .tracking-add input::placeholder { color: var(--muted); }
    .tracking-add button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tracking-add button:hover { background: #7f92ff; }
    .tracking-add button:disabled { opacity: .5; cursor: default; }

    /* Search results list */
    #tracking-results {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      max-width: 580px;
      overflow: hidden;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--surface2); }
    .search-result-thumb {
      width: 36px;
      height: 54px;
      object-fit: cover;
      border-radius: 3px;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .search-result-thumb-fallback {
      width: 36px;
      height: 54px;
      border-radius: 3px;
      background: var(--surface2);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--border);
    }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-title { font-size: 13px; font-weight: 600; }
    .search-result-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .search-result-btn {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-result-btn:hover { background: var(--accent); color: #fff; }

    /* Tracking cards */
    .tracking-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .15s;
    }
    .tracking-card:hover { border-color: var(--accent-dim); }
    .tracking-card.is-available { border-color: #166534; }
    .tracking-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .tracking-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tracking-poster-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: var(--border);
    }
    .tracking-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .tracking-title { font-size: 13px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tracking-meta  { font-size: 11px; color: var(--muted); }
    .available-badge {
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: #052e16;
      border: 1px solid #166534;
      border-radius: 4px;
      padding: 3px 7px;
      display: inline-block;
    }
    .tracking-footer { display: flex; gap: 5px; margin-top: auto; }
    .remove-tracking-btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .remove-tracking-btn:hover { border-color: #ef4444; color: #ef4444; }
    .add-to-watchlist-btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .add-to-watchlist-btn:hover { background: var(--accent); color: #fff; }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #layout { flex-direction: column; }
      #filters { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid var(--border); }
      #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

<header>
  <h1>Streaming <span>Tracker</span></h1>
  <input type="search" id="search-input" placeholder="Search titles, cast, director…">
  <div id="auth-area">
    <span id="user-name"></span>
    <button id="auth-btn">Sign in with Google</button>
  </div>
</header>

<nav class="tab-bar">
  <button class="tab active" data-tab="discover">Discover</button>
  <button class="tab" data-tab="mylists">My Lists<span id="my-lists-count" class="tab-badge" hidden>0</span></button>
</nav>

<div id="discover-pane">
<div id="layout">

  <!-- ── Filters ─────────────────────────────────────────────────────────── -->
  <aside id="filters">

    <div class="filter-section">
      <h3>Provider</h3>
      <div class="cb-list">
        <label><input type="checkbox" class="provider-cb" value="jhs" checked>
          <span class="badge-jhs">JioHotstar</span></label>
        <label><input type="checkbox" class="provider-cb" value="prv" checked>
          <span class="badge-prv">Prime Video</span></label>
        <label><input type="checkbox" class="provider-cb" value="lgp" checked>
          <span class="badge-lgp">Lionsgate Play</span></label>
        <label><input type="checkbox" class="provider-cb" value="snl" checked>
          <span class="badge-snl">SonyLIV</span></label>
        <label><input type="checkbox" class="provider-cb" value="snx" checked>
          <span class="badge-snx">Sun NXT</span></label>
        <label><input type="checkbox" class="provider-cb" value="zee" checked>
          <span class="badge-zee">ZEE5</span></label>
      </div>
    </div>

    <div class="filter-section">
      <h3>Type</h3>
      <div class="type-btns">
        <button class="type-btn active" data-value="both">Both</button>
        <button class="type-btn" data-value="movie">Movies</button>
        <button class="type-btn" data-value="show">Shows</button>
      </div>
    </div>

    <div class="filter-section">
      <h3>Year</h3>
      <div class="year-inputs">
        <input type="number" id="year-from" min="1900" max="2099" value="1900" placeholder="From">
        <span class="year-sep">–</span>
        <input type="number" id="year-to"   min="1900" max="2099" value="2025" placeholder="To">
      </div>
    </div>

    <div class="filter-section">
      <h3>Genre</h3>
      <div class="genre-list" id="genre-list">
        <span style="color:var(--muted);font-size:12px">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3>Sort by</h3>
      <select id="sort-select">
        <option value="popular">Popular</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>

    <div class="filter-section">
      <div class="toggle-row">
        <label>
          <input type="checkbox" id="hide-seen">
          Hide seen titles
        </label>
      </div>
    </div>

  </aside>

  <!-- ── Main content ──────────────────────────────────────────────────── -->
  <div id="main">
    <div id="stats"></div>
    <div id="loading">Loading titles…</div>
    <div id="grid" style="display:none"></div>
  </div>

</div>
</div><!-- #discover-pane -->

<!-- ── My Lists pane ──────────────────────────────────────────────────── -->
<div id="mylists-pane" hidden>

  <section class="mylist-section">
    <h2>Watchlist</h2>
    <p id="watchlist-empty" class="empty-state"></p>
    <div id="watchlist-grid" class="mylist-grid"></div>
  </section>

  <section class="mylist-section">
    <h2>Coming to Streaming</h2>
    <div class="tracking-add">
      <input type="url" id="tracking-url" placeholder="Paste a JustWatch URL — e.g. https://www.justwatch.com/in/movie/project-hail-mary">
      <button id="tracking-search-btn">Find</button>
    </div>
    <div id="tracking-results" hidden></div>
    <p id="tracking-empty" class="empty-state"></p>
    <div id="tracking-grid" class="mylist-grid"></div>
  </section>

</div>

<script>
// ── Firebase config ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_AUTH_DOMAIN",
  databaseURL:       "YOUR_DATABASE_URL",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ── State ──────────────────────────────────────────────────────────────────────
let currentUser  = null;
let allTitles    = {};   // id → title object
let seenMap      = {};   // id → true
let watchlistMap = {};   // id → true
let trackingMap  = {};   // id → { name, year, posterUrl, contentType, addedAt }

const filters = {
  providers:   new Set(['jhs','prv','lgp','snl','snx','zee']),
  type:        'both',
  yearFrom:    1900,
  yearTo:      2025,
  genres:      new Set(),
  hideSeen:    false,
  searchQuery: '',
  sortBy:      'popular',
};

// ── Auth ───────────────────────────────────────────────────────────────────────
const authBtn  = document.getElementById('auth-btn');
const userName = document.getElementById('user-name');

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    userName.textContent = user.displayName || user.email;
    authBtn.textContent  = 'Sign out';
    authBtn.className    = 'signed-in';

    db.ref('/watchlist').on('value', snap => {
      watchlistMap = snap.val() || {};
      renderGrid(getFiltered());
      if (!document.getElementById('mylists-pane').hidden) renderWatchlistGrid();
      updateMyListsBadge();
    });
    db.ref('/tracking').on('value', snap => {
      trackingMap = snap.val() || {};
      if (!document.getElementById('mylists-pane').hidden) renderTrackingList();
      updateMyListsBadge();
    });
  } else {
    userName.textContent = '';
    authBtn.textContent  = 'Sign in with Google';
    authBtn.className    = '';
    db.ref('/watchlist').off();
    db.ref('/tracking').off();
    watchlistMap = {};
    trackingMap  = {};
    updateMyListsBadge();
  }
  renderGrid(getFiltered());
});

authBtn.addEventListener('click', () => {
  if (currentUser) {
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
});

// ── Data loading ───────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [titlesSnap, seenSnap] = await Promise.all([
      db.ref('/titles').get(),
      db.ref('/seen').get(),
    ]);

    allTitles = titlesSnap.val() || {};
    seenMap   = seenSnap.val()   || {};

    buildFiltersUI();
    applyAndRender();
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
    console.error(err);
  }
}

// ── Build dynamic filter UI ────────────────────────────────────────────────────
function buildFiltersUI() {
  const genreSet = new Set();
  let   minYear  = Infinity;
  let   maxYear  = -Infinity;

  Object.values(allTitles).forEach(t => {
    (t.genres || []).forEach(g => genreSet.add(g));
    if (t.year) { minYear = Math.min(minYear, t.year); maxYear = Math.max(maxYear, t.year); }
  });

  // Year input bounds
  if (isFinite(minYear)) {
    const fromEl = document.getElementById('year-from');
    const toEl   = document.getElementById('year-to');
    fromEl.min = minYear; fromEl.max = maxYear; fromEl.value = minYear;
    toEl.min   = minYear; toEl.max   = maxYear; toEl.value   = maxYear;
    filters.yearFrom = minYear;
    filters.yearTo   = maxYear;
  }

  // Genre checkboxes
  const genreList = document.getElementById('genre-list');
  genreList.innerHTML = '';
  [...genreSet].sort().forEach(g => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" class="genre-cb" value="${escHtml(g)}"> ${escHtml(g)}`;
    genreList.appendChild(lbl);
  });
  genreList.querySelectorAll('.genre-cb').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) filters.genres.add(cb.value);
      else            filters.genres.delete(cb.value);
      applyAndRender();
    })
  );

}

// ── Filter logic ───────────────────────────────────────────────────────────────
function getFiltered() {
  const results = Object.values(allTitles).filter(t => {
    if (filters.providers.size > 0) {
      const provs = t.providers || [];
      if (!provs.some(p => filters.providers.has(p))) return false;
    }
    if (filters.type !== 'both' && t.contentType !== filters.type) return false;
    if (t.year && (t.year < filters.yearFrom || t.year > filters.yearTo)) return false;
    if (filters.genres.size > 0) {
      const tGenres = t.genres || [];
      if (!tGenres.some(g => filters.genres.has(g))) return false;
    }
    if (filters.hideSeen && seenMap[String(t.id)]) return false;
    if (filters.searchQuery) {
      const q       = filters.searchQuery.toLowerCase();
      const inName  = (t.name     || '').toLowerCase().includes(q);
      const inDir   = (t.director || '').toLowerCase().includes(q);
      const inCast  = (t.actors   || []).some(a => a.toLowerCase().includes(q));
      if (!inName && !inDir && !inCast) return false;
    }
    return true;
  });

  switch (filters.sortBy) {
    case 'newest':  results.sort((a, b) => (b.year ?? 0) - (a.year ?? 0));          break;
    case 'oldest':  results.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999));    break;
    case 'rating':  results.sort((a, b) => (b.imdbRating ?? 0) - (a.imdbRating ?? 0)); break;
  }

  return results;
}

function applyAndRender() {
  renderGrid(getFiltered());
}

// ── Card rendering ─────────────────────────────────────────────────────────────
function renderGrid(titles) {
  const grid    = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const stats   = document.getElementById('stats');

  const total    = Object.keys(allTitles).length;
  const seenCount = Object.keys(seenMap).length;
  stats.textContent =
    `Showing ${titles.length} of ${total} titles · ${seenCount} seen`;

  if (total === 0) {
    loading.textContent = 'No titles loaded yet. Run the scraper first.';
    loading.style.display = 'block';
    grid.style.display    = 'none';
    return;
  }
  loading.style.display = 'none';
  grid.style.display    = '';

  grid.innerHTML = '';
  titles.forEach(t => grid.appendChild(makeCard(t)));
}

function makeCard(t, opts = {}) {
  const isSeen        = !!seenMap[String(t.id)];
  const isWatchlisted = !!watchlistMap[String(t.id)];
  const div           = document.createElement('div');
  div.className = 'card' + (isSeen ? ' is-seen' : '');
  div.dataset.id = t.id;

  const provBadges = (t.providers || [])
    .map(p => `<span class="badge ${provBadgeClass(p)}">${provLabel(p)}</span>`)
    .join('');

  const imdbBlock = t.imdbRating
    ? `<div class="card-imdb">
         <span class="imdb-star">★</span>
         <span class="imdb-score">${t.imdbRating.toFixed(1)}</span>
         ${t.imdbVotes ? `<span class="imdb-votes">(${fmtVotes(t.imdbVotes)})</span>` : ''}
       </div>`
    : '';

  const infoParts = [
    t.runtime   ? `⏱ ${t.runtime} min` : null,
    t.ageRating ? t.ageRating : null,
  ].filter(Boolean).join(' · ');

  const genreChipsMeta = (t.genres || []).slice(0, 3)
    .map(g => `<span class="meta-chip">${escHtml(g)}</span>`).join('');

  const creditsBlock = [
    t.director               ? `<div class="card-credit">Dir: <span>${escHtml(t.director)}</span></div>` : '',
    t.actors && t.actors.length ? `<div class="card-credit">Cast: <span>${t.actors.map(escHtml).join(', ')}</span></div>` : '',
  ].join('');

  const relLabel = t.releaseDate
    ? new Date(t.releaseDate + 'T00:00:00').toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' })
    : (t.year || '—');

  const initial   = escHtml((t.name || '?')[0].toUpperCase());
  const disabled  = currentUser ? '' : 'disabled title="Sign in to track"';
  const btnLabel  = isSeen ? '✓ Seen — Undo' : 'Mark as seen';
  const wBtnLabel = isWatchlisted ? '✓ Watchlist' : '+ Watchlist';

  const posterBlock = t.posterUrl
    ? `<img class="card-poster" src="${escHtml(t.posterUrl)}" alt="" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  const footerHtml = opts.watchlistView
    ? `<button class="seen-btn ${isSeen ? 'is-seen' : ''}" ${disabled}>${btnLabel}</button>
       <button class="watch-btn remove-wl" ${disabled}>Remove</button>`
    : `<button class="seen-btn ${isSeen ? 'is-seen' : ''}" ${disabled}>${btnLabel}</button>
       <button class="watch-btn ${isWatchlisted ? 'is-watchlisted' : ''}" ${disabled}>${wBtnLabel}</button>`;

  div.innerHTML = `
    <div class="card-poster-wrap">
      ${posterBlock}
      <div class="card-poster-fallback" style="${t.posterUrl ? '' : 'display:flex'}">${initial}</div>
    </div>
    <div class="card-body">
      <div>
        <div class="card-title">${escHtml(t.name || 'Unknown')}</div>
        <div class="card-year">${relLabel} · ${t.contentType === 'show' ? 'TV Show' : 'Movie'}</div>
        ${infoParts ? `<div class="card-info">${escHtml(infoParts)}</div>` : ''}
      </div>
      <div class="provider-badges">${provBadges}</div>
      ${imdbBlock}
      <div class="card-meta">${genreChipsMeta}</div>
      ${creditsBlock}
      <div class="card-footer" style="margin-top:auto">
        ${footerHtml}
      </div>
    </div>
  `;

  div.querySelector('.seen-btn').addEventListener('click', () => toggleSeen(t.id, !isSeen));
  const wBtn = div.querySelector('.watch-btn');
  if (wBtn) {
    if (opts.watchlistView) {
      wBtn.addEventListener('click', () => toggleWatchlist(t.id, false));
    } else {
      wBtn.addEventListener('click', () => toggleWatchlist(t.id, !isWatchlisted));
    }
  }
  return div;
}

// ── Seen tracking ──────────────────────────────────────────────────────────────
async function toggleSeen(id, markSeen) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (markSeen) {
      await db.ref('/seen/' + key).set(true);
      seenMap[key] = true;
      if (watchlistMap[key]) {
        await db.ref('/watchlist/' + key).remove();
      }
    } else {
      await db.ref('/seen/' + key).remove();
      delete seenMap[key];
    }
    // Re-render only the affected card for speed
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      const fresh = makeCard(allTitles[key] || allTitles[id]);
      card.replaceWith(fresh);
    }
    // Update stats
    const total   = Object.keys(allTitles).length;
    const seenCount = Object.keys(seenMap).length;
    const filtered  = getFiltered();
    document.getElementById('stats').textContent =
      `Showing ${filtered.length} of ${total} titles · ${seenCount} seen`;

    // If hiding-seen and we just marked as seen, remove the card
    if (filters.hideSeen && markSeen) {
      const card2 = document.querySelector(`.card[data-id="${id}"]`);
      if (card2) card2.remove();
    }
  } catch (err) {
    console.error('Seen toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

// ── Watchlist ──────────────────────────────────────────────────────────────────
async function toggleWatchlist(id, add) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (add) await db.ref('/watchlist/' + key).set(true);
    else     await db.ref('/watchlist/' + key).remove();
  } catch (err) {
    console.error('Watchlist toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

function updateMyListsBadge() {
  const total = Object.keys(watchlistMap).length + Object.keys(trackingMap).length;
  const badge = document.getElementById('my-lists-count');
  badge.textContent = total;
  badge.hidden = (total === 0);
}

// ── My Lists rendering ─────────────────────────────────────────────────────────
function renderMyLists() {
  renderWatchlistGrid();
  renderTrackingList();
}

function renderWatchlistGrid() {
  const grid  = document.getElementById('watchlist-grid');
  const empty = document.getElementById('watchlist-empty');

  if (!currentUser) {
    grid.innerHTML = '';
    empty.textContent = 'Sign in to use your watchlist.';
    return;
  }

  const ids    = Object.keys(watchlistMap);
  const titles = ids.map(id => allTitles[id]).filter(Boolean);

  if (!titles.length) {
    grid.innerHTML = '';
    empty.textContent = 'Your watchlist is empty. Add titles from the Discover tab.';
    return;
  }
  empty.textContent = '';
  grid.innerHTML = '';
  titles.forEach(t => grid.appendChild(makeCard(t, { watchlistView: true })));
}

function renderTrackingList() {
  const grid  = document.getElementById('tracking-grid');
  const empty = document.getElementById('tracking-empty');

  if (!currentUser) {
    grid.innerHTML = '';
    empty.textContent = 'Sign in to track titles.';
    return;
  }

  const entries = Object.entries(trackingMap);

  if (!entries.length) {
    grid.innerHTML = '';
    empty.textContent = 'Nothing tracked yet. Paste a JustWatch URL above to start tracking.';
    return;
  }
  empty.textContent = '';
  grid.innerHTML = '';
  entries.forEach(([id, meta]) => grid.appendChild(makeTrackingCard(id, meta)));
}

function makeTrackingCard(id, meta) {
  const matchedTitle = Object.values(allTitles).find(
    t => t.name && t.name.toLowerCase() === (meta.name || '').toLowerCase()
      && t.contentType === meta.contentType
  );
  const isAvailable = !!matchedTitle;
  const div = document.createElement('div');
  div.className = 'tracking-card' + (isAvailable ? ' is-available' : '');

  const initial    = escHtml((meta.name || '?')[0].toUpperCase());
  const posterSrc  = matchedTitle?.posterUrl || null;
  const posterHtml = posterSrc
    ? `<img class="tracking-poster" src="${escHtml(posterSrc)}" alt="" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  const disabled = currentUser ? '' : 'disabled';

  const availSection = isAvailable
    ? `<div class="available-badge">Now on streaming ✓</div>
       <div class="provider-badges">
         ${(matchedTitle.providers || []).map(p => `<span class="badge ${provBadgeClass(p)}">${provLabel(p)}</span>`).join('')}
       </div>`
    : `<div class="tracking-meta">Not yet on your platforms</div>`;

  const addedDate = meta.addedAt
    ? new Date(meta.addedAt).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' })
    : '';

  div.innerHTML = `
    <div class="tracking-poster-wrap">
      ${posterHtml}
      <div class="tracking-poster-fallback" style="${posterSrc ? '' : 'display:flex'}">${initial}</div>
    </div>
    <div class="tracking-body">
      <div class="tracking-title">${escHtml(meta.name || 'Unknown')}</div>
      <div class="tracking-meta">${meta.contentType === 'show' ? 'TV Show' : 'Movie'}</div>
      ${availSection}
      ${addedDate ? `<div class="tracking-meta">Added ${addedDate}</div>` : ''}
      <div class="tracking-footer">
        ${isAvailable ? `<button class="add-to-watchlist-btn" ${disabled}>+ Watchlist</button>` : ''}
        <button class="remove-tracking-btn" ${disabled}>Stop tracking</button>
      </div>
    </div>
  `;

  if (isAvailable) {
    div.querySelector('.add-to-watchlist-btn')?.addEventListener('click', () => toggleWatchlist(matchedTitle.id, true));
  }
  div.querySelector('.remove-tracking-btn').addEventListener('click', async () => {
    try { await db.ref('/tracking/' + id).remove(); }
    catch (err) { alert('Could not remove: ' + err.message); }
  });
  return div;
}

// ── Tracking URL parser ────────────────────────────────────────────────────────

function extractSlugAndType(url) {
  const m = url.match(/justwatch\.com\/[a-z]+\/(movie|show)\/([^?#/]+)/i);
  return m ? { type: m[1], slug: m[2] } : null;
}

document.getElementById('tracking-search-btn').addEventListener('click', () => {
  const urlVal    = document.getElementById('tracking-url').value.trim();
  const parsed    = extractSlugAndType(urlVal);
  const container = document.getElementById('tracking-results');
  if (!parsed) {
    alert('Paste a valid JustWatch URL (e.g. https://www.justwatch.com/in/movie/project-hail-mary)');
    return;
  }
  const displayName = parsed.slug.split('-')
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const typeLabel = parsed.type === 'movie' ? 'Movie' : 'TV Show';

  container.innerHTML = `
    <div class="search-result-item">
      <div class="search-result-thumb-fallback">${escHtml(displayName[0] || '?')}</div>
      <div class="search-result-info">
        <div class="search-result-title">${escHtml(displayName)}</div>
        <div class="search-result-meta">${typeLabel}</div>
      </div>
      <button class="search-result-btn" id="confirm-track-btn">Track this</button>
    </div>
  `;
  container.hidden = false;

  document.getElementById('confirm-track-btn').addEventListener('click', async () => {
    const key = parsed.type + '_' + parsed.slug;
    try {
      await db.ref('/tracking/' + key).set({
        name:        displayName,
        contentType: parsed.type,
        addedAt:     Date.now(),
      });
      document.getElementById('tracking-url').value = '';
      container.hidden = true;
      container.innerHTML = '';
    } catch (err) {
      alert('Could not save: ' + err.message);
    }
  });
});

// ── Tab switching ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('discover-pane').hidden = (tab !== 'discover');
    document.getElementById('mylists-pane').hidden  = (tab !== 'mylists');
    if (tab === 'mylists') renderMyLists();
  });
});

// ── Year number inputs ─────────────────────────────────────────────────────────
document.getElementById('year-from').addEventListener('change', function() {
  const v = parseInt(this.value, 10);
  if (isNaN(v)) return;
  const toEl = document.getElementById('year-to');
  if (v > +toEl.value) toEl.value = v;
  filters.yearFrom = v;
  applyAndRender();
});
document.getElementById('year-to').addEventListener('change', function() {
  const v = parseInt(this.value, 10);
  if (isNaN(v)) return;
  const fromEl = document.getElementById('year-from');
  if (v < +fromEl.value) fromEl.value = v;
  filters.yearTo = v;
  applyAndRender();
});

// ── Other filter event listeners ───────────────────────────────────────────────
document.querySelectorAll('.provider-cb').forEach(cb => {
  cb.addEventListener('change', () => {
    if (cb.checked) filters.providers.add(cb.value);
    else            filters.providers.delete(cb.value);
    applyAndRender();
  });
});

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filters.type = btn.dataset.value;
    applyAndRender();
  });
});

document.getElementById('sort-select').addEventListener('change', e => {
  filters.sortBy = e.target.value;
  applyAndRender();
});

document.getElementById('hide-seen').addEventListener('change', e => {
  filters.hideSeen = e.target.checked;
  applyAndRender();
});

document.getElementById('search-input').addEventListener('input', e => {
  filters.searchQuery = e.target.value.trim();
  applyAndRender();
});

// ── Helpers ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function provLabel(code) {
  return { jhs: 'JioHotstar', prv: 'Prime', lgp: 'Lionsgate', snl: 'SonyLIV', snx: 'Sun NXT', zee: 'ZEE5' }[code] || code.toUpperCase();
}

function provBadgeClass(code) {
  return { jhs: 'badge-jhs-card', prv: 'badge-prv-card', lgp: 'badge-lgp-card', snl: 'badge-snl-card', snx: 'badge-snx-card', zee: 'badge-zee-card' }[code] || 'badge-other';
}

const LANG_NAMES = {
  en: 'English', hi: 'Hindi', ta: 'Tamil', te: 'Telugu',
  ml: 'Malayalam', kn: 'Kannada', mr: 'Marathi', bn: 'Bengali',
  pa: 'Punjabi', gu: 'Gujarati', ko: 'Korean', ja: 'Japanese',
  fr: 'French', de: 'German', es: 'Spanish', it: 'Italian',
  zh: 'Chinese', pt: 'Portuguese', ru: 'Russian', ar: 'Arabic',
};
function langLabel(code) {
  return LANG_NAMES[code] || code.toUpperCase();
}

function fmtVotes(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'K';
  return String(n);
}

// ── Boot ───────────────────────────────────────────────────────────────────────
loadData();
</script>
