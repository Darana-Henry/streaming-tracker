<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Tracker</title>

  <!-- Firebase SDK (compat mode — no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Fonts (Stitch "Dark Cinema Aesthetic" design system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    /* ── Reset / base ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Stitch "Dark Cinema Aesthetic" design system ─────────────────────────── */
    :root {
      --bg:           #051424;
      --surface:      #0d1c2d;
      --surface2:     #122131;
      --surface3:     #1c2b3c;
      --surface4:     #273647;
      --border:       rgba(255,255,255,0.08);
      --border2:      rgba(255,255,255,0.05);
      --text:         #d4e4fa;
      --muted:        rgba(199,196,215,0.75);
      --accent:       #6366f1;
      --accent-light: #c0c1ff;
      --accent-dim:   rgba(99,102,241,0.15);
      --accent-glow:  rgba(99,102,241,0.25);
      --seen-bg:      rgba(5,20,36,0.6);
      --seen-border:  rgba(22,101,52,0.4);

      /* Provider colours */
      --jhs: #8b5cf6;
      --prv: #0ea5e9;
      --lgp: #f97316;
      --snl: #ef4444;
      --snx: #fb923c;
      --zee: #a855f7;
      --vim: #7c3aed;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    header {
      background: rgba(5,20,36,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.5px; flex: 1; }
    header h1 span { color: var(--accent-light); }

    #auth-area { display: flex; align-items: center; gap: 12px; }
    #user-name { font-size: 13px; color: var(--muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #auth-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }
    #auth-btn:hover { background: #7275f5; box-shadow: 0 0 16px var(--accent-glow); }
    #auth-btn.signed-in {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 400;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────── */
    #layout { display: flex; align-items: flex-start; }

    /* ── Filter sidebar ──────────────────────────────────────────────────────── */
    #filters {
      width: 232px;
      min-width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border2);
      padding: 20px 16px;
      min-height: calc(100vh - 93px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .filter-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-light);
      margin-bottom: 8px;
    }

    /* Checkboxes */
    .cb-list { display: flex; flex-direction: column; gap: 4px; }
    .cb-list label, .toggle-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      padding: 4px 6px;
      border-radius: 6px;
      transition: background .15s;
    }
    .cb-list label:hover { background: rgba(255,255,255,0.04); }
    .cb-list input[type="checkbox"], .toggle-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer;
    }

    /* Provider colours in filter */
    .badge-jhs { color: var(--jhs); }
    .badge-prv { color: var(--prv); }
    .badge-lgp { color: var(--lgp); }
    .badge-snl { color: var(--snl); }
    .badge-snx { color: var(--snx); }
    .badge-zee { color: var(--zee); }
    .badge-vim { color: var(--vim); }

    /* Content type buttons */
    .type-btns { display: flex; gap: 3px; background: var(--surface2); padding: 3px; border-radius: 8px; }
    .type-btn {
      flex: 1;
      padding: 5px 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .type-btn.active {
      background: rgba(99,102,241,0.25);
      color: var(--accent-light);
      font-weight: 600;
    }

    /* Year range inputs */
    .year-inputs { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .year-inputs input[type="number"] {
      width: 66px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 5px 7px;
      font-family: inherit;
      -moz-appearance: textfield;
    }
    .year-inputs input[type="number"]::-webkit-inner-spin-button,
    .year-inputs input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .year-inputs input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .year-sep { font-size: 12px; color: var(--muted); }

    /* Genre / language list (scrollable) */
    .filter-search {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 10px;
      margin-bottom: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      transition: border-color .15s;
    }
    .filter-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .genre-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--surface4) transparent;
    }
    .genre-list label { font-size: 12px; }
    .genre-list label.hidden { display: none; }

    /* Language select */
    select {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    select:focus { border-color: var(--accent); }
    select option { background: var(--surface3); }

    /* Hide-seen toggle */
    .toggle-row { margin-top: 4px; }

    /* ── Main area ────────────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      padding: 20px 24px;
      min-width: 0;
    }

    #stats {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Recent Releases strip ───────────────────────────────────────────────── */
    #new-this-month { margin-bottom: 32px; }
    #new-this-month h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      letter-spacing: -.3px;
    }
    #new-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface4) transparent;
    }
    #new-strip::-webkit-scrollbar { height: 4px; }
    #new-strip::-webkit-scrollbar-thumb { background: var(--surface4); border-radius: 2px; }
    .strip-card {
      flex: 0 0 120px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .strip-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 16px var(--accent-glow); }
    .strip-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }
    .strip-card-info { padding: 6px 8px 8px; }
    .strip-card-title { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strip-card-date { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Card grid ────────────────────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      transition: border-color .2s, box-shadow .2s;
    }
    .card:hover { border-color: rgba(99,102,241,0.35); box-shadow: 0 0 24px rgba(99,102,241,0.12); }
    .card.is-seen {
      background: var(--seen-bg);
      border-color: var(--seen-border);
      opacity: .6;
    }
    .card.is-seen:hover { opacity: .8; }

    /* Poster */
    .card-poster-wrap {
      position: relative;
      width: 100px;
      min-width: 100px;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
      align-self: stretch;
    }
    .card-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-poster-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--surface4);
      background: var(--surface2);
    }

    /* Card body */
    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-year { font-size: 12px; color: var(--muted); }
    .card-logline {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .provider-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: .3px;
    }
    .badge-jhs-card { background: rgba(139,92,246,0.18); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
    .badge-prv-card { background: rgba(14,165,233,0.18); color: #38bdf8; border: 1px solid rgba(14,165,233,0.3); }
    .badge-lgp-card { background: rgba(249,115,22,0.18); color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
    .badge-snl-card { background: rgba(239,68,68,0.18);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-snx-card { background: rgba(251,146,60,0.18); color: #fdba74; border: 1px solid rgba(251,146,60,0.3); }
    .badge-zee-card { background: rgba(168,85,247,0.18); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .badge-vim-card { background: rgba(124,58,237,0.18); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
    .badge-other    { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    .card-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .meta-chip {
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 6px;
      border: 1px solid var(--border);
    }

    .card-imdb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: rgba(245,197,24,0.1);
      border: 1px solid rgba(245,197,24,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .imdb-star { color: #f5c518; font-size: 12px; }
    .imdb-score { font-weight: 700; color: var(--text); }
    .imdb-votes { color: var(--muted); font-size: 10px; }

    .card-info  { font-size: 11px; color: var(--muted); }
    .card-credit { font-size: 11px; color: var(--muted); }
    .card-credit span { color: var(--text); }

    /* ── Search ──────────────────────────────────────────────────────────────── */
    #search-input {
      flex: 1;
      max-width: 320px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 7px 16px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    #search-input::placeholder { color: var(--muted); }

    .card-footer { display: flex; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 4px; }

    .seen-btn {
      width: 100%;
      padding: 5px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .seen-btn:hover { border-color: var(--accent); color: var(--accent-light); background: var(--accent-dim); }
    .seen-btn.is-seen { background: rgba(22,101,52,0.2); border-color: rgba(22,101,52,0.45); color: #4ade80; }
    .seen-btn:disabled { opacity: .35; cursor: default; }

    /* ── Loading / empty states ──────────────────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Dismiss button ────────────────────────────────────────────────────────── */
    .dismiss-btn {
      width: 100%;
      padding: 5px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .dismiss-btn:hover { border-color: #ef4444; color: #f87171; }
    .dismiss-btn.is-dismissed { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); color: #f87171; }
    .dismiss-btn:disabled { opacity: .35; cursor: default; }

    /* ── Watchlist button ──────────────────────────────────────────────────────── */
    .watch-btn {
      width: 100%;
      padding: 5px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .watch-btn:hover { border-color: var(--accent); color: var(--accent-light); background: var(--accent-dim); }
    .watch-btn.is-watchlisted { background: var(--accent-dim); border-color: rgba(99,102,241,0.5); color: var(--accent-light); }
    .watch-btn.remove-wl:hover { border-color: #ef4444; color: #f87171; }
    .watch-btn:disabled { opacity: .35; cursor: default; }

    /* ── Tabs ────────────────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 0 24px;
      background: rgba(5,20,36,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border2);
    }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 9999px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── My Lists pane ──────────────────────────────────────────────────────── */
    #mylists-pane { padding: 24px; }
    .mylist-section { margin-bottom: 48px; }
    .mylist-section h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); letter-spacing: -.3px; }
    .mylist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 12px;
    }
    .empty-state { color: var(--muted); font-size: 14px; padding: 12px 0; }

    /* ── Watchlist filter bar ───────────────────────────────────────────────── */
    .wl-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .wl-row { display: flex; align-items: center; gap: 8px; }
    .wl-type-btns { display: flex; gap: 4px; }
    .wl-type-btn {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 5px 14px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: all .15s;
    }
    .wl-type-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .wl-controls select {
      width: 150px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 13px; padding: 5px 10px; cursor: pointer;
    }
    .wl-count { font-size: 12px; color: var(--muted); margin-left: 4px; }

    /* ── Tracking add area ──────────────────────────────────────────────────── */
    .tracking-add { display: flex; gap: 8px; margin-bottom: 12px; max-width: 600px; }
    .tracking-add input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .tracking-add input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .tracking-add input::placeholder { color: var(--muted); }
    .tracking-add button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .tracking-add button:hover { background: #7275f5; box-shadow: 0 0 16px var(--accent-glow); }
    .tracking-add button:disabled { opacity: .5; cursor: default; }

    /* Search results list */
    #tracking-results {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      max-width: 600px;
      overflow: hidden;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border2);
      transition: background .12s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--surface2); }
    .search-result-thumb {
      width: 38px;
      height: 57px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .search-result-thumb-fallback {
      width: 38px;
      height: 57px;
      border-radius: 4px;
      background: var(--surface2);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--surface4);
    }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-title { font-size: 13px; font-weight: 600; }
    .search-result-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .search-result-btn {
      background: var(--accent-dim);
      color: var(--accent-light);
      border: 1px solid rgba(99,102,241,0.4);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .search-result-btn:hover { background: var(--accent); color: #fff; }

    /* Tracking cards */
    .tracking-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      transition: border-color .2s;
    }
    .tracking-card:hover { border-color: rgba(99,102,241,0.3); }
    .tracking-card.is-available { border-color: rgba(22,101,52,0.5); box-shadow: 0 0 12px rgba(74,222,128,0.08); }
    .tracking-poster-wrap {
      position: relative;
      width: 90px;
      min-width: 90px;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
      align-self: stretch;
    }
    .tracking-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tracking-poster-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: var(--surface4);
      background: var(--surface2);
    }
    .tracking-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
    .tracking-title { font-size: 13px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tracking-meta  { font-size: 11px; color: var(--muted); }
    .available-badge {
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74,222,128,0.12);
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 9999px;
      padding: 3px 10px;
      display: inline-block;
    }
    .tracking-footer { display: flex; gap: 5px; margin-top: auto; padding-top: 8px; }
    .remove-tracking-btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .remove-tracking-btn:hover { border-color: #ef4444; color: #f87171; }
    .add-to-watchlist-btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid rgba(99,102,241,0.4);
      background: var(--accent-dim);
      color: var(--accent-light);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .add-to-watchlist-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Stats pane ─────────────────────────────────────────────────────────── */
    #stats-pane { padding: 24px; max-width: 900px; }

    .stat-headline { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 18px 24px;
      min-width: 140px;
      transition: border-color .2s, box-shadow .2s;
    }
    .stat-card:hover { border-color: rgba(99,102,241,0.3); box-shadow: 0 0 16px rgba(99,102,241,0.08); }
    .stat-card-value { font-size: 28px; font-weight: 700; color: var(--accent-light); line-height: 1.1; }
    .stat-card-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .stat-section { margin-bottom: 36px; }
    .stat-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--text); }

    .chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .chart-label { width: 180px; font-size: 13px; color: var(--muted); text-align: right;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .chart-bar-wrap { flex: 1; background: var(--surface2); border-radius: 6px; height: 22px; overflow: hidden; }
    .chart-bar { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%); border-radius: 6px; min-width: 4px; transition: width .5s ease; }
    .chart-count { width: 28px; font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; }

    /* ── Responsive ──────────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      #grid { grid-template-columns: 1fr; }
      .mylist-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      #layout { flex-direction: column; }
      #filters { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid var(--border2); }
    }
  </style>
</head>

<script>
// ── Firebase config ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_AUTH_DOMAIN",
  databaseURL:       "YOUR_DATABASE_URL",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ── State ──────────────────────────────────────────────────────────────────────
let currentUser   = null;
let allTitles     = {};   // id → title object
let seenMap       = {};   // id → true
let watchlistMap  = {};   // id → true
let trackingMap   = {};   // id → { name, year, posterUrl, contentType, addedAt }
let dismissedMap  = {};   // id → true

const filters = {
  providers:   new Set(['jhs','prv','lgp','snl','snx','zee','vim']),
  type:        'both',
  yearFrom:    1900,
  yearTo:      2025,
  genres:      new Set(),
  audioLangs:  new Set(),
  hideSeen:         false,
  hideWatchlisted:  false,
  hideDismissed:    true,
  searchQuery: '',
  sortBy:      'popular',
};

// ── Auth ───────────────────────────────────────────────────────────────────────
const authBtn  = document.getElementById('auth-btn');
const userName = document.getElementById('user-name');

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    userName.textContent = user.displayName || user.email;
    authBtn.textContent  = 'Sign out';
    authBtn.className    = 'signed-in';

    db.ref('/watchlist').on('value', snap => {
      watchlistMap = snap.val() || {};
      renderGrid(getFiltered());
      if (!document.getElementById('mylists-pane').hidden) renderWatchlistGrid();
      updateMyListsBadge();
    });
    db.ref('/tracking').on('value', snap => {
      trackingMap = snap.val() || {};
      if (!document.getElementById('mylists-pane').hidden) renderTrackingList();
      updateMyListsBadge();
    });
    db.ref('/dismissed').on('value', snap => {
      dismissedMap = snap.val() || {};
      renderGrid(getFiltered());
    });
  } else {
    userName.textContent = '';
    authBtn.textContent  = 'Sign in with Google';
    authBtn.className    = '';
    db.ref('/watchlist').off();
    db.ref('/tracking').off();
    db.ref('/dismissed').off();
    watchlistMap  = {};
    dismissedMap  = {};
    trackingMap  = {};
    updateMyListsBadge();
  }
  renderGrid(getFiltered());
});

authBtn.addEventListener('click', () => {
  if (currentUser) {
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
});

// ── Data loading ───────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [titlesSnap, seenSnap] = await Promise.all([
      db.ref('/titles').get(),
      db.ref('/seen').get(),
    ]);

    allTitles = titlesSnap.val() || {};
    seenMap   = seenSnap.val()   || {};

    buildFiltersUI();
    applyAndRender();
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
    console.error(err);
  }
}

// ── Build dynamic filter UI ────────────────────────────────────────────────────
function buildFiltersUI() {
  const genreSet = new Set();
  const langSet  = new Set();
  let   minYear  = Infinity;
  let   maxYear  = -Infinity;

  Object.values(allTitles).forEach(t => {
    (t.genres || []).forEach(g => genreSet.add(g));
    (t.audioLanguages || []).forEach(l => langSet.add(l));
    if (t.year) { minYear = Math.min(minYear, t.year); maxYear = Math.max(maxYear, t.year); }
  });

  // Year input bounds
  if (isFinite(minYear)) {
    const fromEl = document.getElementById('year-from');
    const toEl   = document.getElementById('year-to');
    fromEl.min = minYear; fromEl.max = maxYear; fromEl.value = minYear;
    toEl.min   = minYear; toEl.max   = maxYear; toEl.value   = maxYear;
    filters.yearFrom = minYear;
    filters.yearTo   = maxYear;
  }

  // Genre checkboxes
  const genreList = document.getElementById('genre-list');
  genreList.innerHTML = '';
  [...genreSet].sort().forEach(g => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" class="genre-cb" value="${escHtml(g)}"> ${escHtml(toTitleCase(g))}`;
    genreList.appendChild(lbl);
  });
  genreList.querySelectorAll('.genre-cb').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) filters.genres.add(cb.value);
      else            filters.genres.delete(cb.value);
      applyAndRender();
    })
  );
  document.getElementById('genre-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    genreList.querySelectorAll('label').forEach(lbl => {
      const checked = lbl.querySelector('input').checked;
      const matches = lbl.textContent.trim().toLowerCase().startsWith(q);
      lbl.classList.toggle('hidden', q.length > 0 && !matches && !checked);
    });
  });

  // Audio language checkboxes
  const langList = document.getElementById('lang-list');
  langList.innerHTML = '';
  [...langSet].sort((a, b) => langLabel(a).localeCompare(langLabel(b))).forEach(code => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" class="lang-cb" value="${escHtml(code)}"> ${escHtml(langLabel(code))}`;
    langList.appendChild(lbl);
  });
  langList.querySelectorAll('.lang-cb').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) filters.audioLangs.add(cb.value);
      else            filters.audioLangs.delete(cb.value);
      applyAndRender();
    })
  );
  document.getElementById('lang-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    langList.querySelectorAll('label').forEach(lbl => {
      const checked = lbl.querySelector('input').checked;
      const matches = lbl.textContent.trim().toLowerCase().startsWith(q);
      lbl.classList.toggle('hidden', q.length > 0 && !matches && !checked);
    });
  });

}

// ── Filter logic ───────────────────────────────────────────────────────────────
function getFiltered() {
  const results = Object.values(allTitles).filter(t => {
    if (filters.providers.size > 0) {
      const provs = t.providers || [];
      if (!provs.some(p => filters.providers.has(p))) return false;
    }
    if (filters.type !== 'both' && t.contentType !== filters.type) return false;
    if (t.year && (t.year < filters.yearFrom || t.year > filters.yearTo)) return false;
    if (filters.genres.size > 0) {
      const tGenres = t.genres || [];
      if (!tGenres.some(g => filters.genres.has(g))) return false;
    }
    if (filters.hideSeen && seenMap[String(t.id)]) return false;
    if (filters.hideWatchlisted && watchlistMap[String(t.id)]) return false;
    if (filters.hideDismissed && dismissedMap[String(t.id)]) return false;
    if (filters.audioLangs.size > 0) {
      const tLangs = t.audioLanguages || [];
      if (!tLangs.some(l => filters.audioLangs.has(l))) return false;
    }
    if (filters.searchQuery) {
      const q       = filters.searchQuery.toLowerCase();
      const inName  = (t.name     || '').toLowerCase().includes(q);
      const inDir   = (t.director || '').toLowerCase().includes(q);
      const inCast  = (t.actors   || []).some(a => a.toLowerCase().includes(q));
      if (!inName && !inDir && !inCast) return false;
    }
    return true;
  });

  switch (filters.sortBy) {
    case 'newest':  results.sort((a, b) => (b.year ?? 0) - (a.year ?? 0));          break;
    case 'oldest':  results.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999));    break;
    case 'rating':  results.sort((a, b) => (b.imdbRating ?? 0) - (a.imdbRating ?? 0)); break;
  }

  return results;
}

function applyAndRender() {
  renderGrid(getFiltered());
  renderNewThisMonth();
}

function renderNewThisMonth() {
  const strip     = document.getElementById('new-strip');
  const container = document.getElementById('new-this-month');
  const minYear   = new Date().getFullYear() - 2;  // last 3 years inclusive

  const recent = Object.values(allTitles)
    .filter(t => {
      if (!t.year || t.year < minYear) return false;
      if (filters.type !== 'both' && t.contentType !== filters.type) return false;
      if (filters.hideSeen && seenMap[String(t.id)]) return false;
      if (filters.hideDismissed && dismissedMap[String(t.id)]) return false;
      return true;
    })
    .sort((a, b) => (b.year - a.year) || ((b.imdbRating || 0) - (a.imdbRating || 0)))
    .slice(0, 10);

  if (!recent.length) { container.style.display = 'none'; return; }

  container.style.display = 'block';
  strip.innerHTML = '';
  recent.forEach(t => {
    const el = document.createElement('div');
    el.className = 'strip-card';
    el.innerHTML = `
      <img src="${t.posterUrl || ''}" alt="" loading="lazy"
           onerror="this.style.background='var(--surface2)';this.removeAttribute('src')">
      <div class="strip-card-info">
        <div class="strip-card-title">${escHtml(t.name || '')}</div>
        <div class="strip-card-date">${t.year || ''}</div>
      </div>`;
    strip.appendChild(el);
  });
}

// ── Card rendering ─────────────────────────────────────────────────────────────
function renderGrid(titles) {
  const grid    = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const stats   = document.getElementById('stats');

  const total    = Object.keys(allTitles).length;
  const seenCount = Object.keys(seenMap).length;
  stats.textContent =
    `Showing ${titles.length} of ${total} titles · ${seenCount} seen`;

  if (total === 0) {
    loading.textContent = 'No titles loaded yet. Run the scraper first.';
    loading.style.display = 'block';
    grid.style.display    = 'none';
    return;
  }
  loading.style.display = 'none';
  grid.style.display    = '';

  grid.innerHTML = '';
  titles.forEach(t => grid.appendChild(makeCard(t)));
}

function makeCard(t, opts = {}) {
  const isSeen        = !!seenMap[String(t.id)];
  const isWatchlisted = !!watchlistMap[String(t.id)];
  const isDismissed   = !!dismissedMap[String(t.id)];
  const div           = document.createElement('div');
  div.className = 'card' + (isSeen ? ' is-seen' : '');
  div.dataset.id = t.id;

  const provBadges = (t.providers || [])
    .map(p => `<span class="badge ${provBadgeClass(p)}">${provLabel(p)}</span>`)
    .join('');

  const imdbBlock = t.imdbRating
    ? `<div class="card-imdb">
         <span class="imdb-star">★</span>
         <span class="imdb-score">${t.imdbRating.toFixed(1)}</span>
         ${t.imdbVotes ? `<span class="imdb-votes">(${fmtVotes(t.imdbVotes)})</span>` : ''}
       </div>`
    : '';

  const infoParts = [
    t.runtime   ? `⏱ ${t.runtime} min` : null,
    t.ageRating ? t.ageRating : null,
  ].filter(Boolean).join(' · ');

  const genreChipsMeta = (t.genres || []).slice(0, 3)
    .map(g => `<span class="meta-chip">${escHtml(toTitleCase(g))}</span>`).join('');

  const creditsBlock = [
    t.director               ? `<div class="card-credit">Dir: <span>${escHtml(t.director)}</span></div>` : '',
    t.actors && t.actors.length ? `<div class="card-credit">Cast: <span>${t.actors.map(escHtml).join(', ')}</span></div>` : '',
  ].join('');

  const relLabel = t.releaseDate
    ? new Date(t.releaseDate + 'T00:00:00').toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' })
    : (t.year || '—');

  const initial   = escHtml((t.name || '?')[0].toUpperCase());
  const disabled   = currentUser ? '' : 'disabled title="Sign in to track"';
  const btnLabel   = isSeen ? '✓ Seen — Undo' : 'Mark as seen';
  const wBtnLabel  = isWatchlisted ? '✓ Watchlist' : '+ Watchlist';
  const dBtnLabel  = isDismissed ? '✗ Dismissed — Undo' : 'Not Interested';

  const posterBlock = t.posterUrl
    ? `<img class="card-poster" src="${escHtml(t.posterUrl)}" alt="" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  const footerHtml = opts.watchlistView
    ? `<button class="seen-btn ${isSeen ? 'is-seen' : ''}" ${disabled}>${btnLabel}</button>
       <button class="watch-btn remove-wl" ${disabled}>Remove</button>`
    : `<button class="seen-btn ${isSeen ? 'is-seen' : ''}" ${disabled}>${btnLabel}</button>
       <button class="watch-btn ${isWatchlisted ? 'is-watchlisted' : ''}" ${disabled}>${wBtnLabel}</button>
       <button class="dismiss-btn ${isDismissed ? 'is-dismissed' : ''}" ${disabled}>${dBtnLabel}</button>`;

  div.innerHTML = `
    <div class="card-poster-wrap">
      ${posterBlock}
      <div class="card-poster-fallback" style="${t.posterUrl ? '' : 'display:flex'}">${initial}</div>
    </div>
    <div class="card-body">
      <div class="card-title-row">
        <div class="card-title">${escHtml(t.name || 'Unknown')}</div>
        ${imdbBlock}
      </div>
      <div class="card-year">${relLabel} · ${t.contentType === 'show' ? 'TV Show' : 'Movie'}</div>
      ${t.shortDescription ? `<div class="card-logline">${escHtml(t.shortDescription)}</div>` : ''}
      <div class="provider-badges">${provBadges}</div>
      ${infoParts ? `<div class="card-info">${escHtml(infoParts)}</div>` : ''}
      <div class="card-meta">${genreChipsMeta}</div>
      ${creditsBlock}
      <div class="card-footer">
        ${footerHtml}
      </div>
    </div>
  `;

  div.querySelector('.seen-btn').addEventListener('click', () => toggleSeen(t.id, !isSeen));
  const wBtn = div.querySelector('.watch-btn');
  if (wBtn) {
    if (opts.watchlistView) {
      wBtn.addEventListener('click', () => toggleWatchlist(t.id, false));
    } else {
      wBtn.addEventListener('click', () => toggleWatchlist(t.id, !isWatchlisted));
    }
  }
  div.querySelector('.dismiss-btn')?.addEventListener('click', () => toggleDismissed(t.id, !isDismissed));
  return div;
}

// ── Seen tracking ──────────────────────────────────────────────────────────────
async function toggleSeen(id, markSeen) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (markSeen) {
      await db.ref('/seen/' + key).set(true);
      seenMap[key] = true;
      if (watchlistMap[key]) {
        await db.ref('/watchlist/' + key).remove();
      }
    } else {
      await db.ref('/seen/' + key).remove();
      delete seenMap[key];
    }
    // Re-render only the affected card for speed
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      const fresh = makeCard(allTitles[key] || allTitles[id]);
      card.replaceWith(fresh);
    }
    // Update stats
    const total   = Object.keys(allTitles).length;
    const seenCount = Object.keys(seenMap).length;
    const filtered  = getFiltered();
    document.getElementById('stats').textContent =
      `Showing ${filtered.length} of ${total} titles · ${seenCount} seen`;

    // If hiding-seen and we just marked as seen, remove the card
    if (filters.hideSeen && markSeen) {
      const card2 = document.querySelector(`.card[data-id="${id}"]`);
      if (card2) card2.remove();
    }
  } catch (err) {
    console.error('Seen toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

// ── Watchlist ──────────────────────────────────────────────────────────────────
async function toggleWatchlist(id, add) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (add) await db.ref('/watchlist/' + key).set(true);
    else     await db.ref('/watchlist/' + key).remove();
  } catch (err) {
    console.error('Watchlist toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

// ── Dismiss ────────────────────────────────────────────────────────────────────
async function toggleDismissed(id, dismiss) {
  if (!currentUser) return;
  const key = String(id);
  try {
    if (dismiss) {
      await db.ref('/dismissed/' + key).set(true);
      dismissedMap[key] = true;
    } else {
      await db.ref('/dismissed/' + key).remove();
      delete dismissedMap[key];
    }
    if (filters.hideDismissed && dismiss) {
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) card.remove();
      const filtered = getFiltered();
      const total    = Object.keys(allTitles).length;
      document.getElementById('stats').textContent =
        `Showing ${filtered.length} of ${total} titles · ${Object.keys(seenMap).length} seen`;
    } else {
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) card.replaceWith(makeCard(allTitles[key] || allTitles[id]));
    }
  } catch (err) {
    console.error('Dismiss toggle failed', err);
    alert('Could not save: ' + err.message);
  }
}

function updateMyListsBadge() {
  const total = Object.keys(watchlistMap).length + Object.keys(trackingMap).length;
  const badge = document.getElementById('my-lists-count');
  badge.textContent = total;
  badge.hidden = (total === 0);
}

// ── My Lists rendering ─────────────────────────────────────────────────────────
const wlFilters = { type: 'both', provider: '', sort: 'newest' };

function renderMyLists() {
  renderWatchlistGrid();
  renderTrackingList();
}

function renderWatchlistGrid() {
  const grid  = document.getElementById('watchlist-grid');
  const empty = document.getElementById('watchlist-empty');
  const count = document.getElementById('wl-count');

  if (!currentUser) {
    grid.innerHTML = ''; count.textContent = '';
    empty.textContent = 'Sign in to use your watchlist.';
    return;
  }

  const all = Object.keys(watchlistMap).map(id => allTitles[id]).filter(Boolean);

  if (!all.length) {
    grid.innerHTML = ''; count.textContent = '';
    empty.textContent = 'Your watchlist is empty. Add titles from the Discover tab.';
    return;
  }

  let titles = all.slice();
  if (wlFilters.type !== 'both') titles = titles.filter(t => t.contentType === wlFilters.type);
  if (wlFilters.provider)        titles = titles.filter(t => (t.providers || []).includes(wlFilters.provider));

  switch (wlFilters.sort) {
    case 'newest': titles.sort((a, b) => (b.year ?? 0)    - (a.year ?? 0));           break;
    case 'oldest': titles.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999));        break;
    case 'rating': titles.sort((a, b) => (b.imdbRating ?? 0) - (a.imdbRating ?? 0)); break;
    case 'az':     titles.sort((a, b) => (a.name || '').localeCompare(b.name || '')); break;
  }

  count.textContent = titles.length < all.length
    ? `Showing ${titles.length} of ${all.length}`
    : `${all.length} title${all.length !== 1 ? 's' : ''}`;

  empty.textContent = titles.length ? '' : 'No titles match the current filters.';
  grid.innerHTML = '';
  titles.forEach(t => grid.appendChild(makeCard(t, { watchlistView: true })));
}

function renderTrackingList() {
  const grid  = document.getElementById('tracking-grid');
  const empty = document.getElementById('tracking-empty');

  if (!currentUser) {
    grid.innerHTML = '';
    empty.textContent = 'Sign in to track titles.';
    return;
  }

  const entries = Object.entries(trackingMap);

  if (!entries.length) {
    grid.innerHTML = '';
    empty.textContent = 'Nothing tracked yet. Paste a JustWatch URL above to start tracking.';
    return;
  }
  empty.textContent = '';
  grid.innerHTML = '';
  entries.forEach(([id, meta]) => grid.appendChild(makeTrackingCard(id, meta)));
}

// ── Stats ──────────────────────────────────────────────────────────────────────
function renderStats() {
  const pane = document.getElementById('stats-pane');
  const seenTitles = Object.keys(seenMap).map(id => allTitles[id]).filter(Boolean);

  if (!seenTitles.length) {
    pane.innerHTML = '<p class="empty-state" style="padding:40px 24px">No watched titles yet — mark some as seen in Discover.</p>';
    return;
  }

  // Headline numbers
  const totalWatched = seenTitles.length;
  const totalMins    = seenTitles.reduce((s, t) => s + (t.runtime || 0), 0);
  const totalHours   = (totalMins / 60).toFixed(1);
  const rated        = seenTitles.filter(t => t.imdbRating);
  const avgRating    = rated.length
    ? (rated.reduce((s, t) => s + t.imdbRating, 0) / rated.length).toFixed(1) : '—';
  const platTally = {};
  seenTitles.forEach(t => (t.providers || []).forEach(p => { platTally[p] = (platTally[p] || 0) + 1; }));
  const topPlatEntry = Object.entries(platTally).sort((a, b) => b[1] - a[1])[0];
  const topPlatLabel = topPlatEntry ? provLabel(topPlatEntry[0]) : '—';

  // By platform
  const platRows = Object.entries(platTally).sort((a, b) => b[1] - a[1]);

  // By genre (top 10)
  const genreTally = {};
  seenTitles.forEach(t => (t.genres || []).forEach(g => { genreTally[g] = (genreTally[g] || 0) + 1; }));
  const genreRows = Object.entries(genreTally).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // By IMDB rating bracket
  const ratingBrackets = [
    { label: 'Excellent  (8 – 10)', min: 8,  max: 11 },
    { label: 'Great  (7 – 8)',      min: 7,  max: 8  },
    { label: 'Good  (6 – 7)',       min: 6,  max: 7  },
    { label: 'Average  (5 – 6)',    min: 5,  max: 6  },
    { label: 'Poor  (< 5)',         min: 0,  max: 5  },
    { label: 'Unrated',             min: null, max: null },
  ];
  const ratingRows = ratingBrackets
    .map(b => {
      const count = seenTitles.filter(t =>
        b.min === null ? !t.imdbRating : (t.imdbRating && t.imdbRating >= b.min && t.imdbRating < b.max)
      ).length;
      return [b.label, count];
    })
    .filter(([, c]) => c > 0);

  // By decade
  const decadeTally = {};
  seenTitles.forEach(t => {
    if (!t.year) return;
    const d     = Math.floor(t.year / 10) * 10;
    const label = d < 1990 ? 'Before 1990' : `${d}s`;
    decadeTally[label] = (decadeTally[label] || 0) + 1;
  });
  const decadeRows = Object.entries(decadeTally).sort((a, b) => {
    const ya = a[0] === 'Before 1990' ? 0 : parseInt(a[0]);
    const yb = b[0] === 'Before 1990' ? 0 : parseInt(b[0]);
    return ya - yb;
  });

  function makeChart(rows) {
    const max = Math.max(...rows.map(([, c]) => c), 1);
    return rows.map(([label, count]) => `
      <div class="chart-row">
        <div class="chart-label">${escHtml(String(label))}</div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="width:${Math.round(count / max * 100)}%"></div>
        </div>
        <div class="chart-count">${count}</div>
      </div>`).join('');
  }

  pane.innerHTML = `
    <div class="stat-headline">
      <div class="stat-card">
        <div class="stat-card-value">${totalWatched}</div>
        <div class="stat-card-label">Titles watched</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${totalHours}h</div>
        <div class="stat-card-label">Total runtime</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${avgRating}</div>
        <div class="stat-card-label">Avg IMDB rating</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${escHtml(topPlatLabel)}</div>
        <div class="stat-card-label">Most watched on</div>
      </div>
    </div>

    ${platRows.length ? `
    <div class="stat-section">
      <h2>By streaming platform</h2>
      ${makeChart(platRows.map(([p, c]) => [provLabel(p), c]))}
    </div>` : ''}

    ${genreRows.length ? `
    <div class="stat-section">
      <h2>By genre</h2>
      ${makeChart(genreRows)}
    </div>` : ''}

    ${ratingRows.length ? `
    <div class="stat-section">
      <h2>By IMDB rating</h2>
      ${makeChart(ratingRows)}
    </div>` : ''}

    ${decadeRows.length ? `
    <div class="stat-section">
      <h2>By decade</h2>
      ${makeChart(decadeRows)}
    </div>` : ''}
  `;
}

function makeTrackingCard(id, meta) {
  const matchedTitle = Object.values(allTitles).find(
    t => t.name && t.name.toLowerCase() === (meta.name || '').toLowerCase()
      && t.contentType === meta.contentType
  );
  const isAvailable = !!matchedTitle;
  const div = document.createElement('div');
  div.className = 'tracking-card' + (isAvailable ? ' is-available' : '');

  const initial    = escHtml((meta.name || '?')[0].toUpperCase());
  const posterSrc  = matchedTitle?.posterUrl || meta.posterUrl || null;
  const posterHtml = posterSrc
    ? `<img class="tracking-poster" src="${escHtml(posterSrc)}" alt="" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  const disabled = currentUser ? '' : 'disabled';

  const availSection = isAvailable
    ? `<div class="available-badge">Now on streaming ✓</div>
       <div class="provider-badges">
         ${(matchedTitle.providers || []).map(p => `<span class="badge ${provBadgeClass(p)}">${provLabel(p)}</span>`).join('')}
       </div>`
    : `<div class="tracking-meta">Not yet on your platforms</div>`;

  const addedDate = meta.addedAt
    ? new Date(meta.addedAt).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' })
    : '';

  div.innerHTML = `
    <div class="tracking-poster-wrap">
      ${posterHtml}
      <div class="tracking-poster-fallback" style="${posterSrc ? '' : 'display:flex'}">${initial}</div>
    </div>
    <div class="tracking-body">
      <div class="tracking-title">${escHtml(meta.name || 'Unknown')}</div>
      <div class="tracking-meta">${meta.contentType === 'show' ? 'TV Show' : 'Movie'}</div>
      ${availSection}
      ${addedDate ? `<div class="tracking-meta">Added ${addedDate}</div>` : ''}
      <div class="tracking-footer">
        ${isAvailable ? `<button class="add-to-watchlist-btn" ${disabled}>+ Watchlist</button>` : ''}
        <button class="remove-tracking-btn" ${disabled}>Stop tracking</button>
      </div>
    </div>
  `;

  if (isAvailable) {
    div.querySelector('.add-to-watchlist-btn')?.addEventListener('click', () => toggleWatchlist(matchedTitle.id, true));
  }
  div.querySelector('.remove-tracking-btn').addEventListener('click', async () => {
    try { await db.ref('/tracking/' + id).remove(); }
    catch (err) { alert('Could not remove: ' + err.message); }
  });
  return div;
}

// ── Tracking URL parser ────────────────────────────────────────────────────────

function extractFullPath(url) {
  const m = url.match(/justwatch\.com(\/[a-z]+\/(movie|show)\/[^?#/]+)/i);
  return m ? { fullPath: m[1], type: m[2] } : null;
}

async function jwFetchByPath(fullPath) {
  const query = `query GetTitleByPath($fullPath: String!, $country: Country!, $language: Language!) {
    urlV2(fullPath: $fullPath) {
      node {
        objectId
        objectType
        content(country: $country, language: $language) {
          title
          posterUrl
          originalReleaseYear
        }
      }
    }
  }`;
  const resp = await fetch('https://apis.justwatch.com/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ query, variables: { fullPath, country: 'IN', language: 'en' } }),
  });
  if (!resp.ok) throw new Error('JustWatch request failed');
  const json = await resp.json();
  const node = json?.data?.urlV2?.node;
  if (!node) throw new Error('Title not found');
  const c = node.content || {};
  let posterUrl = null;
  if (c.posterUrl) {
    posterUrl = 'https://images.justwatch.com' +
      c.posterUrl.replace('{profile}', 's332').replace('{format}', 'webp');
  }
  return {
    objectId:    node.objectId,
    name:        c.title        || '',
    year:        c.originalReleaseYear || null,
    contentType: node.objectType === 'MOVIE' ? 'movie' : 'show',
    posterUrl,
  };
}

document.getElementById('tracking-search-btn').addEventListener('click', async () => {
  const urlVal    = document.getElementById('tracking-url').value.trim();
  const parsed    = extractFullPath(urlVal);
  const container = document.getElementById('tracking-results');
  const btn       = document.getElementById('tracking-search-btn');
  if (!parsed) {
    alert('Paste a valid JustWatch URL (e.g. https://www.justwatch.com/in/movie/project-hail-mary)');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Finding…';
  container.hidden = true;
  container.innerHTML = '';

  let meta;
  try {
    meta = await jwFetchByPath(parsed.fullPath);
  } catch (err) {
    // CORS or network failure — fall back to slug-derived name, no poster
    const slug = parsed.fullPath.split('/').pop();
    meta = {
      objectId:    null,
      name:        slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
      year:        null,
      contentType: parsed.type,
      posterUrl:   null,
    };
  }
  btn.disabled = false; btn.textContent = 'Find';

  const thumbHtml = meta.posterUrl
    ? `<img src="${escHtml(meta.posterUrl)}" style="width:48px;aspect-ratio:2/3;object-fit:cover;border-radius:4px" alt="">`
    : `<div class="search-result-thumb-fallback">${escHtml((meta.name || '?')[0])}</div>`;

  container.innerHTML = `
    <div class="search-result-item">
      ${thumbHtml}
      <div class="search-result-info">
        <div class="search-result-title">${escHtml(meta.name)}</div>
        <div class="search-result-meta">${meta.contentType === 'movie' ? 'Movie' : 'TV Show'}${meta.year ? ' · ' + meta.year : ''}</div>
      </div>
      <button class="search-result-btn" id="confirm-track-btn">Track this</button>
    </div>
  `;
  container.hidden = false;

  document.getElementById('confirm-track-btn').addEventListener('click', async () => {
    const slug = parsed.fullPath.split('/').pop();
    const key  = meta.objectId ? String(meta.objectId) : (parsed.type + '_' + slug);
    try {
      await db.ref('/tracking/' + key).set({
        name:        meta.name,
        year:        meta.year,
        posterUrl:   meta.posterUrl,
        contentType: meta.contentType,
        addedAt:     Date.now(),
      });
      document.getElementById('tracking-url').value = '';
      container.hidden = true;
      container.innerHTML = '';
    } catch (err) {
      alert('Could not save: ' + err.message);
    }
  });
});

// ── Tab switching ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('discover-pane').hidden = (tab !== 'discover');
    document.getElementById('mylists-pane').hidden  = (tab !== 'mylists');
    document.getElementById('stats-pane').hidden    = (tab !== 'stats');

    if (tab === 'stats')   renderStats();
  });
});

document.getElementById('year-from').addEventListener('change', function() {
  const v = parseInt(this.value, 10);
  if (isNaN(v)) return;
  const toEl = document.getElementById('year-to');
  if (v > +toEl.value) toEl.value = v;
  filters.yearFrom = v;
  applyAndRender();

document.getElementById('year-to').addEventListener('change', function() {
  const v = parseInt(this.value, 10);
  if (isNaN(v)) return;
  const fromEl = document.getElementById('year-from');
  if (v < +fromEl.value) fromEl.value = v;
  filters.yearTo = v;
  applyAndRender();
});

document.querySelectorAll('.provider-cb').forEach(cb => {

document.querySelectorAll('.type-btn').forEach(btn => {

// ── Helpers ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function provLabel(code) {
  return { jhs: 'JioHotstar', prv: 'Prime', lgp: 'Lionsgate', snl: 'SonyLIV', snx: 'Sun NXT', zee: 'ZEE5', vim: 'Voot' }[code] || code.toUpperCase();
}

function provBadgeClass(code) {
  return { jhs: 'badge-jhs-card', prv: 'badge-prv-card', lgp: 'badge-lgp-card', snl: 'badge-snl-card', snx: 'badge-snx-card', zee: 'badge-zee-card', vim: 'badge-vim-card' }[code] || 'badge-other';
}

function toTitleCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

const _langDisplay = new Intl.DisplayNames(['en'], { type: 'language' });
function langLabel(code) {
  try { return _langDisplay.of(code) || code; } catch { return code; }
}

function fmtVotes(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'K';
  return String(n);
}
