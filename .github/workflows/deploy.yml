name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config
        run: |
          sed -i \
            -e 's|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g' \
            -e 's|YOUR_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g' \
            -e 's|YOUR_DATABASE_URL|${{ secrets.FIREBASE_DATABASE_URL }}|g' \
            -e 's|YOUR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g' \
            -e 's|YOUR_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g' \
            -e 's|YOUR_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g' \
            -e 's|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g' \
            docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
