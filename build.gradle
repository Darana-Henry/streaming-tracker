plugins {
    id 'java'
    id 'application'
}

group = 'com.streamingtracker'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.streamingtracker.Main'
}

// Fat jar — all deps bundled so `java -jar` works without a classpath
jar {
    manifest {
        attributes 'Main-Class': 'com.streamingtracker.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Convenience: `./gradlew run --args="--providers=hst,prv --year-from=2010"`
run {
    if (project.hasProperty('appArgs')) {
        args project.appArgs.split(',')
    }
}
